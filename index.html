<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>로또 번호 회피 규칙 추천기</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">테스트 버전</p>
        <h1>로또 번호 회피 규칙 추천기</h1>
        <p class="warning"><span class="warning-line">※ 로또 복권의 누적 당첨 기록을 바탕으로</span><span class="warning-line">저빈도 패턴을 회피하는 번호 추천 도구</span></p>
        <p class="sub intro">이 도구는 과거 기록을 바탕으로 번호 선택을 돕는 참고용 서비스입니다.</p>
      </div>
      <div class="meta">
        <div>최신 회차: <strong id="latestRound">-</strong></div>
        <div>추첨일: <strong id="latestDate">-</strong></div>
        <div>데이터 상태: <strong id="dataStatus">로드 대기</strong></div>
        <div class="meta-tools">
          <div class="meta-inline">
            <div class="meta-box data-info" id="dataInfo">전수 데이터: -</div>
            <button id="refreshBtn" class="secondary refresh-btn">최신화</button>
          </div>
          <p id="refreshNote" class="note"></p>
        </div>
      </div>
    </header>

    <section class="panel howto-panel">
      <h2>페이지 사용 방법</h2>
      <ul class="howto-list">
        <li>추천 번호 생성 버튼을 누르면 카드가 만들어집니다.</li>
        <li>카드별 옵션을 바꾸고 다시 <strong>추천 번호 생성 버튼</strong>을 누르면 변화된 옵션으로 번호가 생성됩니다.</li>
      </ul>
    </section>

    <section class="panel rules-row">
      <div class="rules-main" id="ruleSummary"></div>
    </section>

    <section class="toolbar panel">
      <div class="actions">
        <button id="generateBtn">추천 번호 생성</button>
        <button id="copyBtn" class="secondary">클립보드에 복사</button>
      </div>
    </section>

    <section class="results" id="results"></section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
